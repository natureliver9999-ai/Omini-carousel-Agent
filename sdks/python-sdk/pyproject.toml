[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-carousel"
version = "0.1.0"
description = "Python SDK for omni-carousel: typed CarouselSpec models, Anthropic/OpenAI tool definitions, and a local runner for the deterministic render engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Omni Carousel Contributors" }]
keywords = ["carousel", "instagram", "linkedin", "mcp", "content", "agents"]
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.20"]

[project.scripts]
omni-carousel-py = "omni_carousel.cli:main"

[tool.setuptools.packages.find]
include = ["omni_carousel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
